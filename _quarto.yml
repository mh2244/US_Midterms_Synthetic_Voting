project:
  type: website
  output-dir: docs
  render:
    - index.qmd
  resources:
    - assets/fonts

website:
  title: "Synthetic Voting for the 2026 U.S. Senate Midterm Elections"
  page-footer:
    left: "Jingxuan Feng, Maggie Huang, and Kexin Liu"
    right: "[Code and data on GitHub](https://github.com/mh2244/US_Midterms_Synthetic_Voting)"

format:
  html:
    theme: default
    css: styles.css
    fontsize: 1rem
    toc: false
    page-layout: article
    grid:
      body-width: 900px
      margin-width: 60px
      gutter-width: 2rem
    fig-align: center
    smooth-scroll: true
