# Purpose: Full forecast run on the three news days (Oct 27, 29, 31):
#          collect news -> concatenate nine summaries/persona -> prompts (08) -> model queries (09) -> SSR (10)
#          -> forecast (11: synthetic only, shrinkage, then inverse-variance headline last)
#          -> figures (13, 15) -> crosstabs (16) -> tests (12) -> publish latest (17)
#          -> render the website (Quarto, into docs/) -> commit.
# Commit rule: model answers are always committed (so a rerun only asks for what is missing);
# the forecast, figures and website are committed only if every step, including the tests, passed.
# Needs: repository secret OPENROUTER_API_KEY.
# Manual run: Actions > Forecast run > Run workflow. Leave run empty for today's
# Toronto date, or enter nonews for the baseline.
# RUN selects matching output and commit paths; completed answers are saved even on failure.
# Disable this workflow before the project deadline.

name: Forecast run

on:
  schedule:
    - cron: "13 18 27,29,31 10 *"  # 2:13 pm Toronto on these October dates
  workflow_dispatch:
    inputs:
      run:
        description: "Run id: empty = today's date (Toronto); or nonews"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: forecast-run
  cancel-in-progress: false

env:
  SUMMARY_SCRIPT: scripts/04b-summarize_news.py

jobs:
  forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt

      - name: Set the run id
        id: run_info
        env:
          RUN_INPUT: ${{ inputs.run }}
        run: |
          RUN="$RUN_INPUT"
          if [ -z "$RUN" ]; then RUN=$(TZ=America/Toronto date +%F); fi
          if [[ "$RUN" != "nonews" && ! "$RUN" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "Run id must be nonews or YYYY-MM-DD" >&2
            exit 1
          fi
          echo "RUN=$RUN" >> "$GITHUB_ENV"
          echo "run_id=$RUN" >> "$GITHUB_OUTPUT"
          echo "Run id: $RUN"

      - name: Refresh polling data for this forecast
        run: |
          python scripts/polling_data/00-download_polling_data.py
          python scripts/polling_data/01-clean_polling_data.py
          mkdir -p "data/03-results/run_${RUN}"
          cp data/polling_data/02-analysis_data/senate_polls_2026_general.csv \
             "data/03-results/run_${RUN}/polling_input.csv"

      - name: Collect news and assemble persona news
        if: steps.run_info.outputs.run_id != 'nonews'
        run: |
          python scripts/04-collect_news.py
          python "$SUMMARY_SCRIPT"
          cp data/news/news.csv "data/news/news_${RUN}.csv"
          cp data/news/news_context.csv "data/news/news_context_${RUN}.csv"
          cp data/news/persona_news_summaries.csv "data/news/persona_news_summaries_${RUN}.csv"

      - name: Build prompts (08)
        run: |
          if [ "$RUN" = "nonews" ]; then
            python scripts/08-build_prompts.py
          else
            python scripts/08-build_prompts.py --news
          fi

      - name: Query models (09)
        # 09 skips prompts that already have an answer, so a retry only sends what is missing
        # (rate limits, provider errors). It exits with an error if calls are still unanswered.
        run: |
          for attempt in 1 2 3; do
            if python scripts/09-query_models.py --batch-size 40 --sleep 0; then exit 0; fi
            echo "Attempt $attempt left calls unanswered; trying again in 60 seconds"
            sleep 60
          done
          exit 1

      - name: Score answers with SSR (10)
        run: python scripts/10-score_responses.py

      - name: Build the forecast (11)
        # The two comparison versions first; the inverse-variance headline last, because
        # scripts 13, 15 and 17 read the files written by the last run of 11.
        run: |
          python scripts/11-build_forecast.py --combine none
          python scripts/11-build_forecast.py --combine shrink
          python scripts/11-build_forecast.py

      - name: Make figures and crosstabs (13, 15, 16)
        run: |
          python scripts/13-make_figures.py
          python scripts/15-make_summary_bar.py
          python scripts/16-make_crosstabs.py

      - name: Test the real data (12)
        run: python scripts/12-test_actual_data.py

      - name: Publish this run on the website (17)
        if: steps.run_info.outputs.run_id != 'nonews'
        run: python scripts/17-publish_latest.py

      - name: Set up Quarto
        if: steps.run_info.outputs.run_id != 'nonews'
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Render the website into docs/
        if: steps.run_info.outputs.run_id != 'nonews'
        run: quarto render

      - name: Upload run files (also after a failure)
        if: ${{ always() && steps.run_info.outputs.run_id != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: forecast-${{ steps.run_info.outputs.run_id }}
          path: |
            data/news/*.csv
            data/polling_data/
            data/02-analysis_data/run_${{ steps.run_info.outputs.run_id }}/
            data/03-results/run_${{ steps.run_info.outputs.run_id }}/
            figures/run_${{ steps.run_info.outputs.run_id }}/
          if-no-files-found: warn

      - name: Commit results (answers always; forecast and website only if everything passed)
        if: ${{ always() && steps.run_info.outputs.run_id != '' }}
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          paths=(data/news data/polling_data "data/02-analysis_data/run_${RUN}")
          if [ "$JOB_STATUS" = "success" ]; then
            paths+=("data/03-results/run_${RUN}" "figures/run_${RUN}" data/03-results/latest figures/latest docs)
            message="Forecast run ${RUN} (automatic)"
          else
            message="Forecast run ${RUN}: model answers only, run did not finish (automatic)"
          fi
          for path in "${paths[@]}"; do
            if [ -e "$path" ]; then git add -A -- "$path"; fi
          done
          if git diff --cached --quiet; then echo "Nothing to commit"; exit 0; fi
          git commit -m "$message"
          # Generated files: if someone pushed meanwhile, keep this run's version on a conflict
          git pull --rebase -X theirs
          git push
